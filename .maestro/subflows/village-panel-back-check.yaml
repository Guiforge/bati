# Reusable: a row inside the village panel was just tapped and a screen opened over it (the copied
# name is the panel's). Back, and the SAME panel must still be showing, the title still stepped aside.
appId: com.guiforge.bati.dev
---
- takeScreenshot: village-panel-3-linked-screen
# Hardware Back, once: the pushed page must take it. The panel's own Back handler used to stay
# registered under the page, so the first press closed the hidden panel and the page stayed.
- back
- assertVisible:
    id: "village-screen"
- assertVisible:
    id: "iso-bulle-nom"
- assertNotVisible:
    id: "village-title"
- assertVisible: ${maestro.copiedText}
- takeScreenshot: village-panel-4-back-with-panel
