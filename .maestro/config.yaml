# Maestro Configuration
# https://maestro.mobile.dev/
#
# Locale is NOT settable here — Maestro pins it at device start:
#   maestro start-device --platform=android --device-locale=en_US
# Flows assert on testID, never translated text, so the device locale
# (this project ships en + fr) can't break them. See README.md.

flows:
  - app-launch.yaml
  - main-journey.yaml
  - explore-tabs.yaml
  - journal-after-session.yaml
  - adventure-journey.yaml
  - oath-flow.yaml
  - session-interruptions.yaml

# subflows/ holds reusable fragments (e.g. complete-onboarding.yaml) pulled in
# via `runFlow:` — they are not standalone entries here.

appId: com.guiforge.bati

screenshotsDir: ./screenshots
