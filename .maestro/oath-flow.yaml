# Maestro E2E Test - Swearing an oath
#
# The oath is the app's single chosen objective. Covers: swear a preset from Home, then reopen
# it and find the sworn oath in place of the empty state.
#
# It also toggled the oath's reminder in Settings, until notifications were removed from the app
# (c7246643). The flow kept tapping `settings-notifications`, a row that no longer exists.
#
# testID only, so an emulator in fr_FR passes too.

appId: com.guiforge.bati.dev
---
- launchApp:
    clearState: true

- runFlow: subflows/complete-onboarding.yaml

# --- Swear ------------------------------------------------------------------

# With nothing sworn the card is the empty-state CTA; either way it opens the oath screen.
- assertVisible:
    id: "home-oath-card"
- tapOn:
    id: "home-oath-card"

- assertVisible:
    id: "oath-screen"
- assertVisible:
    id: "oath-preset"

# Tapping a preset swears it and returns to Home (app/oath.tsx swearPreset -> router.back).
- tapOn:
    id: "oath-preset"
    index: 0

- assertVisible:
    id: "home-oath-card"

# Re-opening now shows the sworn oath and its progress. The presets stay on screen
# (swearing a new one replaces the old), so their absence is not the thing to assert.
- tapOn:
    id: "home-oath-card"
- assertVisible:
    id: "oath-screen"
- assertVisible:
    id: "oath-current"
- back

# Back on Home, the card now carries the sworn oath.
- assertVisible:
    id: "home-oath-card"
