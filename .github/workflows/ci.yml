name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # `biome ci` refuses --write, so a stray autofix cannot slip in here; --reporter=github turns
      # each diagnostic into a PR annotation. --error-on-warnings: a warning that cannot fail
      # anything is a comment with syntax highlighting. Six rules sat at "warn" and blocked
      # nothing until 2026-08-16.
      - run: npx biome ci --error-on-warnings --reporter=github .
      - run: npx tsc --noEmit --project tsconfig.json
      # Pillow decodes the boss art for __tests__/boss-art-frames.test.ts, which fails in CI without it.
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends python3-pil
      - run: npm test -- --coverage
      # Dead code is a correctness problem, not tidiness: saveSessionState() had five tests and
      # no callers, which is how its payload drifted from the real writer's unnoticed. Knip is at
      # zero; anything it reports is new.
      - run: npm run deadcode
      # Dependency versions the installed Expo SDK does not expect compile here and fail on
      # somebody else's machine — F-Droid rebuilds everything from source, so a mismatch is
      # their build error, not ours. Every build log printed the drift for weeks.
      #
      # This was `expo install --check` while doctor had permanent false positives here, and a
      # gate with those is a gate nobody reads. Both are gone: the plugins import
      # `expo/config-plugins` instead of the package directly, and the dead-code script is named
      # `deadcode` so it no longer shadows node_modules/.bin/knip. The third — app.json fields
      # that prebuild syncs, flagged because android/ is committed for F-Droid's subdir check —
      # is switched off in package.json's `expo.doctor`, and the prebuild step below is what
      # actually proves those fields are in sync. So the gate is now all 21 checks, not one.
      #
      # expo-doctor floats (it is fetched, not a devDependency): a new upstream check can turn
      # main red without a commit here. That is the trade for the other 20.
      - run: npx expo-doctor

      # Double distribution makes a licence surprise expensive: F-Droid rejects a tree it cannot
      # redistribute, and it does so at the end of a release cycle, not when the dependency lands.
      # A blocklist, because an allowlist would turn main red every time somebody adds an MIT
      # package, which is a gate nobody reads. scripts/license-lib.ts holds the list and the reason
      # it is a pattern; the same script runs at commit when the lockfile changes.
      #
      # Verified against the tree on 2026-11-01: the only entries outside the MIT family are MPL-2.0
      # (lightningcss), CC-BY-4.0 (caniuse-lite), Python-2.0 (argparse), OFL-1.1 (the fonts) and one
      # BSD/GPL dual (node-forge), all redistributable.
      #
      # This checks the npm tree, which is what Metro bundles. It says nothing about the Gradle
      # side: release.yml reads the foss APK itself for Google code.
      - name: Dependency licences
        run: npm run licenses:check

      # Known vulnerabilities in what ships (audit G2). High and critical only, production tree
      # only; each accepted advisory is an entry with its reason in .github/audit-allowlist.json,
      # so a new one fails here instead of arriving unread. The moderate decode-uri-component
      # advisory is below the bar and explained in SECURITY.md.
      - name: Dependency advisories
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/audit-prod.mjs

      # An invalid workflow file does not fail loudly — it produces a run with no jobs and no
      # error, which is exactly how v1.0.1 shipped (see the comment on release.yml's keystore
      # step). actionlint validates the expression syntax and the contexts each field allows.
      # Pinned by tag; the runner image already ships shellcheck for the scripts.
      - name: Lint the workflows and the shell scripts
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
          shellcheck scripts/*.sh
      # actionlint checks that a workflow is valid, zizmor that it is safe: every action pinned by
      # SHA (a moved tag would run in the job that holds the signing key), no token wider than the
      # job needs. An exception is a `# zizmor: ignore[...]` beside the line, with its reason.
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.31.1 --format=github .
      # android/ is committed only so F-Droid's subdir check passes; prebuild regenerates it at
      # build time. That makes drift invisible until someone reads a stale file — so regenerate
      # and fail if the tree disagrees with app.json/plugins.
      - run: |
          npx expo prebuild -p android --clean
          git add -A android
          git diff --cached --exit-code --stat -- android

  # The pre-commit hook reads staged changes only, and --no-verify skips it. This reads every commit
  # and is its own job so that one full clone is not paid for by the checks above.
  # Accepted findings are in .gitleaksignore, by fingerprint. The binary and not the Docker image:
  # the image scanned 0 commits and passed when git could not read the mounted repository.
  secrets:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secrets in the git history
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .
