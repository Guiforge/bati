# Smoke test for the five main feature tabs: onboard, then visit each tab and
# assert its screen actually rendered (not just that the tab button exists).
# testID only, so locale-agnostic.
#
# Taps on tabs cap `waitToSettleTimeoutMs`: the village's embers and the Home flame never stop
# moving, and an uncapped tap waits Maestro's full ceiling (see subflows/run-a-session.yaml).
appId: com.guiforge.bati.dev
tags:
  - smoke
---
- launchApp:
    clearState: true

- runFlow: subflows/complete-onboarding.yaml

- tapOn:
    id: "tab-adventures"
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: "adventures-screen"

- tapOn:
    id: "tab-quests"
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: "quests-quest-card"

- tapOn:
    id: "tab-village"
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: "village-screen"

- tapOn:
    id: "tab-journal"
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: "journal-screen"

- tapOn:
    id: "tab-home"
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: "home-start-session"
