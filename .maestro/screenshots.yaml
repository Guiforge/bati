# Capture the store screenshots from a real device.
#
#   npm run screenshots              # en-US
#   npm run screenshots -- fr-FR     # phone switched to French
#
# Deliberately not a test: nothing asserts a value. It walks the app to the eight screens worth
# showing and photographs each one, so a drifting step produces a wrong picture to look at rather
# than a red run to debug.
#
# It seeds a believable hero first, through the dev screen: three years of history, a maxed
# village and ten extra levels. A store screenshot of an empty village sells nothing, and a level
# 1 journal with one session in it sells less. **This needs a debug build** — the dev screen is
# behind __DEV__ — so run `npx expo run:android --variant debug` before this.
#
# The device language decides the language of the shots.
appId: com.guiforge.bati.dev
tags:
  - screenshots
---
- runFlow: subflows/boot-dev-client.yaml
- extendedWaitUntil:
    visible:
      id: "onboarding-presentation-continue"
    timeout: 120000

# --- 0. The first thing anyone ever sees ------------------------------------
# Photographed before the subflow clicks through it: this screen only exists once per install.
- takeScreenshot: 0-onboarding

- runFlow: subflows/complete-onboarding.yaml
- runFlow: subflows/seed-hero.yaml

# --- 1. Home ----------------------------------------------------------------
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible:
      id: "home-start-session"
    timeout: 30000
- takeScreenshot: 1-home

# --- 2. The quest gallery ---------------------------------------------------
- tapOn:
    id: "tab-quests"
- extendedWaitUntil:
    visible:
      id: "quests-quest-card"
    timeout: 30000
- takeScreenshot: 2-quests

# --- 3. A quest, before committing to it ------------------------------------
- tapOn:
    id: "quests-quest-card"
    index: 0
- assertVisible:
    id: "quest-start"
- takeScreenshot: 3-quest-detail

# --- 4. Mid-set -------------------------------------------------------------
- tapOn:
    id: "quest-start"
- tapOn:
    id: "narrative-confirm"
    optional: true
- extendedWaitUntil:
    visible:
      id: "session-skip-warmup"
    timeout: 15000
    optional: true
- tapOn:
    id: "session-skip-warmup"
    optional: true
- extendedWaitUntil:
    visible:
      id: "session-complete-exercise"
    timeout: 20000
- takeScreenshot: 4-session

# --- 6. Victory -------------------------------------------------------------
# (5 is the boss arena, captured last: jumping to it ends this session.)
- repeat:
    times: 40
    while:
      notVisible:
        id: "session-victory-continue"
    commands:
      - tapOn:
          id: "session-complete-exercise"
          optional: true
      - tapOn:
          id: "session-skip-rest"
          optional: true
- extendedWaitUntil:
    visible:
      id: "session-victory-continue"
    timeout: 25000
- takeScreenshot: 6-victory
- tapOn:
    id: "session-victory-continue"

# --- 7. The village, maxed --------------------------------------------------
- tapOn:
    id: "tab-village"
- extendedWaitUntil:
    visible:
      id: "village-screen"
    timeout: 30000
- takeScreenshot: 7-village

# --- 8. The journal, three years deep ---------------------------------------
- tapOn:
    id: "tab-journal"
- extendedWaitUntil:
    visible:
      id: "journal-screen"
    timeout: 30000
# The stats tab defers its cards by a frame and each one runs its own query; against three years
# of seeded history that is not instant, and the shot caught an empty screen. Land on the tab
# explicitly, then let it settle before photographing it.
- tapOn:
    id: "journal-tab-stats"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 8-journal

# --- The dev screen, which the last two shots both come from -----------------
# Last, because the boss jump drops straight into a session and there is no coming back to the
# tabs without quitting it. Worth the awkward ordering: it is the screen that explains the app.
- tapOn:
    id: "tab-home"
- tapOn:
    id: "home-settings"
- scrollUntilVisible:
    element:
      id: "settings-dev"
    direction: DOWN
- tapOn:
    id: "settings-dev"

# --- 9. An expedition's recap ------------------------------------------------
# The one screen that is a map, and the one the seeded hero above cannot reach: `seedHistory`
# writes strength sessions and knows nothing about GPS. `dev-seed-expedition` writes a finished
# outing with a synthetic trace through the real writers, then opens its recap — the only way to
# photograph this without walking a loop with the phone. The basemap wants the network; without
# it the trace still draws and the shot is merely plainer.
- scrollUntilVisible:
    element:
      id: "dev-seed-expedition"
    direction: DOWN
- tapOn:
    id: "dev-seed-expedition"
- extendedWaitUntil:
    visible:
      id: "expedition-recap-screen"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: 9-recap
- back

# --- 5. The boss arena ------------------------------------------------------
- scrollUntilVisible:
    element:
      text: "Jump to boss fight"
    direction: DOWN
- tapOn: "Jump to boss fight"

# The jump lands on the boss step's quest screen, not inside the session — the fight still has to
# be started like any other.
- extendedWaitUntil:
    visible:
      id: "quest-start"
    timeout: 20000
- tapOn:
    id: "quest-start"
- tapOn:
    id: "narrative-confirm"
    optional: true
- extendedWaitUntil:
    visible:
      id: "session-skip-warmup"
    timeout: 15000
    optional: true
- tapOn:
    id: "session-skip-warmup"
    optional: true
- extendedWaitUntil:
    visible:
      id: "session-complete-exercise"
    timeout: 25000
# One completed exercise, so the arena shows damage landing rather than a boss at full health:
# the bar moving is the whole point of the screen.
- tapOn:
    id: "session-complete-exercise"
- tapOn:
    id: "session-skip-rest"
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 5-boss
