# Maestro E2E Test - Swearing an oath
#
# The oath is the app's single chosen objective. Covers: swear a preset from the Journal, then
# reopen it and find the sworn oath in place of the empty state, and on Home once it is sworn.
#
# It also toggled the oath's reminder in Settings, until notifications were removed from the app
# (c7246643). The flow kept tapping `settings-notifications`, a row that no longer exists.
#
# testID only, so an emulator in fr_FR passes too.

appId: com.guiforge.bati.dev
---
- launchApp:
    clearState: true

- runFlow: subflows/complete-onboarding.yaml

# --- Swear ------------------------------------------------------------------

# A new hero has no strip on Home: with nothing sworn, Home offers the oath only from the third
# session (db/disclosure.ts, 220bb4b3). The flow asserted the empty-state card here and failed on
# every fresh install from that commit on. The Journal always carries the strip, so it goes there.
- assertNotVisible:
    id: "home-oath-card"
- tapOn:
    id: "tab-journal"
- tapOn:
    id: "home-oath-card"

- assertVisible:
    id: "oath-screen"
- assertVisible:
    id: "oath-preset"

# Tapping a preset swears it and returns to the Journal (app/oath.tsx swearPreset -> router.back).
- tapOn:
    id: "oath-preset"
    index: 0

- assertVisible:
    id: "home-oath-card"

# Re-opening now shows the sworn oath and its progress. The presets stay on screen
# (swearing a new one replaces the old), so their absence is not the thing to assert.
# Swearing raises the success toast right over the Journal's strip, and a toast takes the tap
# that lands on it (components/common/Toast.tsx), so the strip is tapped once the toast is gone.
- extendedWaitUntil:
    notVisible:
      id: "toast"
    timeout: 8000
- tapOn:
    id: "home-oath-card"
- assertVisible:
    id: "oath-screen"
- assertVisible:
    id: "oath-current"
- back

# A sworn oath is shown on Home whatever the session count: the state the swear wrote.
- tapOn:
    id: "tab-home"
- assertVisible:
    id: "home-oath-card"
