# Maestro E2E Test - Interrupting a session
#
# The data-loss path. A session that cannot be paused, resumed or abandoned cleanly is
# how a hero loses their work. The crash-and-recover half is unit-tested
# (__tests__/useSessionRecovery.test.ts) because killing the process mid-flow is not
# something Maestro can do reliably; this covers the three deliberate interruptions.
#
# testID only, so an emulator in fr_FR passes too.

appId: com.guiforge.bati.dev
---
- launchApp:
    clearState: true

- runFlow: subflows/complete-onboarding.yaml

# Through the Quests tab, not the Home button: `home-start-session` runs useSmartAction, whose
# destination depends on the active oath and the suggestion state. A flow that has to end up on
# a specific quest cannot start from a button that decides where to go.
- tapOn:
    id: "tab-quests"

- assertVisible:
    id: "quests-quest-card"
- tapOn:
    id: "quests-quest-card"
    index: 0

- assertVisible:
    id: "quest-start"
- tapOn:
    id: "quest-start"

# Warm-up is on by default; skip straight to the workout being interrupted. Waited for, not
# fired blind — see the note in subflows/complete-a-session.yaml.
- extendedWaitUntil:
    visible:
      id: "session-skip-warmup"
    timeout: 15000
    optional: true
- tapOn:
    id: "session-skip-warmup"
    optional: true

# 3s pre-start countdown before the first exercise renders.
- extendedWaitUntil:
    visible:
      id: "session-complete-exercise"
    timeout: 15000

# --- Pause and resume -------------------------------------------------------

- tapOn:
    id: "session-pause"
- assertVisible:
    id: "session-resume"

# The paused view is not asserted by the *absence* of the exercise controls: the overlay
# covers them but leaves them mounted, and Maestro reads the view tree, not occlusion.

- tapOn:
    id: "session-resume"

# Back to the exercise, overlay gone.
- assertVisible:
    id: "session-complete-exercise"
- assertNotVisible:
    id: "session-resume"

# --- Restart the round ------------------------------------------------------

- tapOn:
    id: "session-pause"
- assertVisible:
    id: "session-restart-round"
- tapOn:
    id: "session-restart-round"
- assertVisible:
    id: "session-complete-exercise"

# --- Abandon ----------------------------------------------------------------

- tapOn:
    id: "session-pause"
- assertVisible:
    id: "session-quit"
- tapOn:
    id: "session-quit"

# Quitting lands on Home, not on the quest it came from.
#
# This comment used to claim the opposite — "PausedOverlay handleQuit -> router.back, back to the
# quest" — and the flow asserted `quest-start` on that basis. It was wrong: two failure
# screenshots, one entering through Home and one through the Quests tab, both show the Home tab
# selected afterwards. `handleQuit` does call `router.back()`, so *why* it surfaces here rather
# than on the quest is worth a look; what matters for this flow is that the app is somewhere
# navigable rather than stuck in a torn-down session.
- extendedWaitUntil:
    visible:
      id: "home-start-session"
    timeout: 10000

# And the tabs still work from there.
- tapOn:
    id: "tab-quests"
- assertVisible:
    id: "quests-quest-card"
