# The app's data code against a real WebDAV server, with two devices, in Node: no emulator, no containers.
#
# ci.yml runs the app's own jest suite, where the network, the filesystem and the second device are fakes.
# This runs the real sync, merge, restore and cipher code against `test/infra/faulty/faulty.py`, a WebDAV
# server in the Python standard library that misbehaves on command, plus the property tests (random event
# sequences against two devices, quest files, GPX against the official schema). Short mode only: a few
# minutes. The long mode, the other servers (rclone, Apache, SFTPGo, Nextcloud), the proxies that cut
# the network and the emulators are the release bench, a script outside CI (docs/testing/release-check.md).
name: Node stage

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "db/**"
      - "test/node/**"
      - "test/infra/faulty/**"
      - "__tests__/fixtures/backup/**"
      - "package-lock.json"
      - ".github/workflows/node-stage.yml"
  pull_request:
    paths:
      - "src/**"
      - "db/**"
      - "test/node/**"
      - "test/infra/faulty/**"
      - "__tests__/fixtures/backup/**"
      - "package-lock.json"
      - ".github/workflows/node-stage.yml"

permissions:
  contents: read

jobs:
  node-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm ci --prefix test/node
      # xmllint checks the GPX the app writes against the GPX 1.1 schema.
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: Start the server that misbehaves on command
        run: |
          mkdir -p "$RUNNER_TEMP/faulty"
          DATA_DIR="$RUNNER_TEMP/faulty" python3 test/infra/faulty/faulty.py 28090 &
          for _ in $(seq 1 20); do curl -fs http://127.0.0.1:28090/_admin/files && break; sleep 1; done
      # One random sequence of eight events per run (basics and updates, 20 minutes in all, stay in the bench script). A counterexample prints its seed: replay it with
      # SYNC_SEED and SYNC_PATH (docs/testing/release-check.md).
      - run: node node_modules/jest/bin/jest.js --config test/node/jest.config.js gpx quests restore sync/lagging sync/random
        env:
          SYNC_SERVER: faulty
          SYNC_RUNS: "1"
          SYNC_EVENTS: "8"
