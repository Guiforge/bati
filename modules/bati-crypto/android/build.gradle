plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.guiforge.bati'
version = '0.1.0'

android {
  namespace "expo.modules.baticrypto"
  defaultConfig {
    // Not the APK's version, and not ignorable either: expo-module-gradle-plugin reads this one
    // as the maven artifact version and fails configuration without it. versionCode sat beside it
    // and was the ignored half: AGP has no use for one in a library.
    versionName '0.1.0'
  }
}

dependencies {
  // Argon2id, and nothing else of it: R8 drops the rest in a release build. MIT licence, Maven Central,
  // rebuilt from source by F-Droid like every other dependency. The platform has no Argon2.
  implementation 'org.bouncycastle:bcprov-jdk18on:1.81'

  // JVM unit tests of BatiCryptoCore, which has nothing from Android in it on purpose: see
  // src/test/kotlin. They run in CI (.github/workflows/kotlin.yml) and locally with
  // `cd android && ./gradlew :bati-crypto:testDebugUnitTest`.
  testImplementation 'junit:junit:4.13.2'
}
