name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # --error-on-warnings: a warning that cannot fail anything is a comment with syntax
      # highlighting. Six rules sat at "warn" and blocked nothing until 2026-08-16.
      - run: npx biome check --error-on-warnings .
      - run: npx tsc --noEmit --project tsconfig.json
      - run: npm test
      # Dead code is a correctness problem, not tidiness: saveSessionState() had five tests and
      # no callers, which is how its payload drifted from the real writer's unnoticed. Knip is at
      # zero; anything it reports is new.
      - run: npm run knip
      # android/ is committed only so F-Droid's subdir check passes; prebuild regenerates it at
      # build time. That makes drift invisible until someone reads a stale file — so regenerate
      # and fail if the tree disagrees with app.json/plugins.
      - run: |
          npx expo prebuild -p android --clean
          git add -A android
          git diff --cached --exit-code --stat -- android
