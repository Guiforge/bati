# Smoke: a fresh install boots all the way to the first onboarding screen.

# Asserts a testID rather than taking a screenshot nobody looks at.
appId: com.guiforge.bati.dev
tags:
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "onboarding-presentation-continue"
    timeout: 30000
