name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # --error-on-warnings: a warning that cannot fail anything is a comment with syntax
      # highlighting. Six rules sat at "warn" and blocked nothing until 2026-08-16.
      - run: npx biome check --error-on-warnings .
      - run: npx tsc --noEmit --project tsconfig.json
      - run: npm test
      # Dead code is a correctness problem, not tidiness: saveSessionState() had five tests and
      # no callers, which is how its payload drifted from the real writer's unnoticed. Knip is at
      # zero; anything it reports is new.
      - run: npm run knip
      # A ratchet, not a gate: the error count for noUncheckedIndexedAccess may only go down.
      # See scripts/strict-ratchet.sh for why it is a number and not a flag.
      - run: npm run check:strict
      # Dependency versions the installed Expo SDK does not expect compile here and fail on
      # somebody else's machine — F-Droid rebuilds everything from source, so a mismatch is
      # their build error, not ours. Every build log printed the drift for weeks.
      #
      # `expo install --check` and not `expo-doctor`: doctor fails two of its checks on this
      # project by design — the committed android/ (there so F-Droid's subdir check passes,
      # regenerated by prebuild in every pipeline) and the `knip` script sharing a name with its
      # own binary. A gate with two permanent false positives is a gate nobody reads.
      - run: npx expo install --check

      # An invalid workflow file does not fail loudly — it produces a run with no jobs and no
      # error, which is exactly how v1.0.1 shipped (see the comment on release.yml's keystore
      # step). actionlint validates the expression syntax and the contexts each field allows.
      # Pinned by tag; ubuntu-latest already ships shellcheck for the scripts.
      - name: Lint the workflows and the shell scripts
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
          shellcheck scripts/*.sh
      # android/ is committed only so F-Droid's subdir check passes; prebuild regenerates it at
      # build time. That makes drift invisible until someone reads a stale file — so regenerate
      # and fail if the tree disagrees with app.json/plugins.
      - run: |
          npx expo prebuild -p android --clean
          git add -A android
          git diff --cached --exit-code --stat -- android
