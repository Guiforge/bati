<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bati - Onboarding</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;family=Noto+Sans:wght@300..700&amp;display=swap" rel="stylesheet"/>
<!-- Icons -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d33f2",
                        "background-light": "#f5f6f8",
                        "background-dark": "#101322",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom utilities for comic book feel */
        .comic-shadow {
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }
        .comic-halftone {
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background-light dark:bg-background-dark text-white font-display">
<!-- Main Screen Container -->
<div class="relative flex h-screen w-full flex-col overflow-hidden bg-[#101323] dark group/design-root" style='font-family: "Space Grotesk", "Noto Sans", sans-serif;'>
<!-- Hero Background Layer -->
<div class="absolute inset-0 z-0">
<!-- Main Hero Image -->
<div class="h-full w-full bg-cover bg-center bg-no-repeat" data-alt="Franco-Belgian comic style illustration of a hero overlooking a fantasy village construction site at dusk" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCVZB0heisda-sPpV0VjGmaYpKg7McZtgULwL9FnmJaKntmwUnHQQ6lGpFLlYiWgR-yS2zeN9VMjFAEL2cw2QIR1vklrFXRH2Mg0nNboutpz9aupZLOBNxyJkm-XyJDCpHMVzA8ngffwz2EtOz-TW6cwV6GmCNFCyxTjMPLX1gCPae7akniSqIuIi9bW9kksAr_MDBazj9dZVBYkRUkUcbBb64SbM85eNZCbVIiU2EGlGQ04fQigtquNXvamF-fMZQVNhTaOSVk");'>
</div>
<!-- Comic Halftone Texture Overlay -->
<div class="comic-halftone absolute inset-0 pointer-events-none opacity-20"></div>
<!-- Gradient Overlays for Content Readability -->
<!-- Top Gradient for Logo -->
<div class="absolute top-0 left-0 w-full h-1/3 bg-gradient-to-b from-[#101323] to-transparent opacity-90"></div>
<!-- Bottom Gradient for Text & CTA -->
<div class="absolute bottom-0 left-0 w-full h-2/3 bg-gradient-to-t from-[#101323] via-[#101323]/80 to-transparent"></div>
</div>
<!-- Foreground Content -->
<div class="relative z-10 flex h-full flex-col justify-between px-6 pt-12 pb-8">
<!-- Top Section: Logo -->
<div class="flex flex-col items-center gap-2">
<!-- Decorative Icon representing the 'Quest/Village' aspect -->
<div class="flex h-12 w-12 items-center justify-center rounded-full bg-primary/20 backdrop-blur-sm border border-primary/30 shadow-[0_0_15px_rgba(13,51,242,0.5)]">
<span class="material-symbols-outlined text-primary text-2xl">castle</span>
</div>
<!-- HeadlineText Component adapted -->
<h1 class="text-white tracking-widest text-[40px] font-bold leading-tight text-center comic-shadow">
                    BATI
                </h1>
</div>
<!-- Bottom Section: Welcome Text & Actions -->
<div class="flex flex-col gap-6 w-full max-w-md mx-auto">
<!-- Title & Subtitle -->
<div class="flex flex-col gap-2">
<!-- TitleText Component adapted -->
<h2 class="text-white text-[32px] font-bold leading-tight tracking-[-0.015em] text-center drop-shadow-lg">
                        Your fitness is <br/>
<span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-primary">your fortress.</span>
</h2>
<p class="text-gray-400 text-center text-base font-normal leading-relaxed px-4">
                        Every workout builds your village. Start your adventure today.
                    </p>
</div>
<!-- CTA Button -->
<!-- SingleButton Component adapted -->
<div class="w-full pt-2">
<button class="group flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-full h-14 px-5 bg-primary text-white text-lg font-bold leading-normal tracking-[0.015em] shadow-[0_4px_20px_rgba(13,51,242,0.4)] transition-transform active:scale-95 hover:bg-blue-600 border border-white/10">
<span class="mr-2">Embark on Your Journey</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</div>
<!-- Footer / Secondary Action -->
<!-- MetaText Component adapted -->
<div class="text-center pb-2">
<p class="text-[#909acb] text-sm font-normal leading-normal">
                        Already have an account?
                        <a class="text-white font-medium hover:text-primary transition-colors underline decoration-primary/50 underline-offset-4" href="#">Log in</a>
</p>
</div>
</div>
</div>
<!-- Bottom Safety Spacer (for iOS home indicator) -->
<div class="h-5 shrink-0"></div>
</div>
