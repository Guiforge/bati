# The build recipe for the *official* F-Droid catalogue at f-droid.org.
#
# This file is not read by anything here. It is the source of truth for a file that lives
# somewhere else: submitting means forking https://gitlab.com/fdroid/fdroiddata, copying this to
# `metadata/com.guiforge.bati.yml`, committing it as "New App: com.guiforge.bati" and opening a
# merge request. Keeping our copy in the repo means the recipe is reviewed and versioned with the
# code it builds, instead of drifting inside a fork nobody looks at.
#
# Not to be confused with `fdroid/config.yml`, which configures our own self-hosted repository.
# The two are unrelated: that one signs and indexes APKs we build, this one asks F-Droid to build
# them itself, from source, on its own infrastructure.
#
# NO PREBUILT BINARIES: Expo SDK 57 ships its native modules as precompiled .aar files in a
# bundled `local-maven-repo` — 22 of them, with the Kotlin sources unused beside them. `package.json`
# sets `expo.autolinking.buildFromSource: [".*"]`, which makes Gradle compile every Expo module
# from those sources instead; the subproject count goes from ~20 to 42 and the AARs stop being
# consumed. Nothing here needs to enable it, but a reviewer checking for prebuilt binaries should
# know why they are present in the tree and unused. Removing them outright is not possible — npm
# puts them there — and `scandelete: node_modules` clears them from the scanner's path anyway.
#
# STATUS: not yet submitted. The Firebase strip compiles from source and the whole release APK
# builds locally, but this recipe has never been run through `fdroid build com.guiforge.bati`,
# which is the only thing that proves *it*. Do that before opening the merge request — expect the
# Node bootstrap and `scandelete` to need iteration.

Categories:
  - Sports & Health
License: MIT
AuthorName: Guillaume Pouyat
SourceCode: https://github.com/Guiforge/bati
IssueTracker: https://github.com/Guiforge/bati/issues
Changelog: https://github.com/Guiforge/bati/releases

RepoType: git
Repo: https://github.com/Guiforge/bati.git

Builds:
  - versionName: 1.0.2
    versionCode: 10002
    commit: v1.0.2
    subdir: android/app

    # Expo SDK 57 needs a newer Node than the build image ships. Pinned rather than "latest" so a
    # rebuild of this version years from now still resolves the same toolchain.
    sudo:
      - apt-get update || true
      - apt-get install -y --no-install-recommends curl ca-certificates python3
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y --no-install-recommends nodejs

    # `init` runs at the repo root, which is where all three of these belong. `android/` is
    # gitignored and generated by prebuild, so it does not exist until the third line runs — which
    # is also why `subdir` above points at a directory absent from the checkout.
    init:
      - npm ci
      - python3 scripts/fdroid-strip-firebase.py
      - npx expo prebuild --clean --platform android --no-install

    gradle:
      - yes

    # node_modules is 1 GB of third-party JavaScript that the scanner would otherwise walk. The
    # bundle Metro produces is already inside the APK by this point, so nothing is lost.
    scandelete:
      - node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 1.0.2
CurrentVersionCode: 10002

# Deliberately absent, and worth understanding before adding either:
#
# AntiFeatures: none apply. No ads, no tracking, no network calls at all, and the artwork is
#   CC BY-SA 4.0 with scripts/provenance.json recording model, prompt and seed for every image, so
#   NonFreeAssets does not apply either.
#
# AllowedAPKSigningKeys: not set, which means F-Droid signs its own build with its own key. The
#   consequence is that nobody who installed from GitHub Releases or from our self-hosted
#   repository can update to the f-droid.org build -- Android refuses the install, and
#   uninstalling takes the SQLite database with it. Setting this requires reproducible builds
#   first. See docs/fdroid.md.
