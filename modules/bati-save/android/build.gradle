plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.guiforge.bati'
version = '0.1.0'

android {
  namespace "expo.modules.batisave"
  defaultConfig {
    // Read by expo-module-gradle-plugin as the maven artifact version, see bati-location.
    versionName '0.1.0'
  }
}

dependencies {
  // JVM unit tests of SavedSize, run by .github/workflows/kotlin.yml.
  testImplementation 'junit:junit:4.13.2'
}
