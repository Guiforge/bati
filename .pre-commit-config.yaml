default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: builtin
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
        # Maestro flows are multi-document (config header `---` flow steps).
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        # Village/building art legitimately reaches ~1.8 MB.
        args: [--maxkb=2048]
        # The captured fixtures need a database over two segments (2 MiB) to hold three of them.
        exclude: ^__tests__/fixtures/backup/emulator/
        stages: [pre-commit]
      - id: trailing-whitespace
        exclude: ^(assets/|drizzle/|android/|package-lock\.json)
        stages: [pre-commit]
      - id: end-of-file-fixer
        exclude: ^(assets/|drizzle/|android/|package-lock\.json)
        stages: [pre-commit]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # The workflows hold the release keystore and the Play credentials. zizmor reads them (and
  # dependabot.yml) for unpinned actions, broad tokens and risky triggers; CI runs it too.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: biome
        name: biome check
        entry: npx biome check --write --error-on-warnings --no-errors-on-unmatched
        language: system
        types_or: [ts, tsx, javascript, json]

      - id: tsc
        name: tsc --noEmit
        entry: npx tsc --noEmit --project tsconfig.json
        language: system
        pass_filenames: false
        files: \.(ts|tsx)$

      # Biome for the JavaScript, ktlint for the Kotlin, and the same bargain: the hook rewrites,
      # CI only reports. Everything else in this repo reads TypeScript, so until this existed the
      # two `.kt` files were first compiled when an APK was built, which is to say on a tag.
      - id: ktlint
        name: ktlint --format
        entry: ./scripts/ktlint.sh --format
        language: system
        pass_filenames: false
        files: \.kt$

      - id: jest
        name: npm test
        entry: npm test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: deadcode
        name: deadcode (knip)
        entry: npm run deadcode
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
