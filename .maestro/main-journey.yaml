# Maestro E2E Test - Main Journey
#
# The one loop that has to work: onboarding -> home -> pick a quest -> run the
# session -> victory -> back home. Every step asserts; nothing here is a
# screenshot the reviewer has to eyeball.
#
# Targets testID only, never translated text, so an emulator in fr_FR passes
# too. See README.md for the convention and the device-locale pin.

appId: com.guiforge.bati.dev

---
# Fresh install: no stored preferences, no training history.
- launchApp:
    clearState: true

# --- Onboarding -------------------------------------------------------------

- runFlow: subflows/complete-onboarding.yaml

# --- Home -------------------------------------------------------------------

- assertVisible:
    id: "home-start-session"

# With no training history the smart action falls through to the quest gallery
# (useSmartAction step 3). Deterministic on a cleared state.
- tapOn:
    id: "home-start-session"

# --- Quest -> session -------------------------------------------------------

- assertVisible:
    id: "quests-quest-card"
- tapOn:
    id: "quests-quest-card"
    index: 0

- runFlow: subflows/complete-a-session.yaml

# --- Full circle ------------------------------------------------------------

# Back on home, with the session banked.
- assertVisible:
    id: "home-start-session"
