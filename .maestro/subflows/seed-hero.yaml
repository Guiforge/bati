# Reusable: turn a blank install into a hero worth photographing — three years of history, a
# maxed village and ten extra levels. Assumes onboarding is done and the home tab is showing.
#
# An empty village sells nothing and a level 1 journal with one session in it sells less; an
# audit of empty screens is a different run (audit-fresh.yaml), on purpose.
#
# The dev screen has no testIDs and no i18n — its labels are stable English, so text is the only
# selector available and the safest one here. **Needs a debug build**: the screen is behind __DEV__.
appId: com.guiforge.bati.dev
---
- tapOn:
    id: "home-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "settings-dev"
    direction: DOWN
- tapOn:
    id: "settings-dev"

# The seed buttons sit near the top of the dev screen. A scroll down here started before the
# Crests board below them had rendered (it is several screens of shields and slow to draw), went
# past them and never came back, and the store run died before its first shot. Wait instead.
- extendedWaitUntil:
    visible:
      text: "3y"
    timeout: 60000
- tapOn: "3y" # ~550 sessions: streaks, records, achievements, muscle balance
# No "Max out village" step: the button is gone, the village derives from the seeded history.

- scrollUntilVisible:
    element:
      text: "+5"
    timeout: 60000
    direction: UP
- tapOn: "+5"
- tapOn: "+5"

- back
- back
