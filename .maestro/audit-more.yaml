# The screens audit.yaml never reached: the Forge and its editors, the journal's sub-pages, and
# the Settings rows that open a screen of their own (pause, set aside, XP, what's new...).
#
# A third run rather than more steps in audit.yaml: that flow ends inside a boss fight it cannot
# leave, and every step added before it is one more chance to lose its place. Same contract:
# nothing asserted, every tap optional, back-to-tabs between sections.
appId: com.guiforge.bati.dev
tags:
  - audit
---
- runFlow: subflows/boot-dev-client.yaml
- extendedWaitUntil:
    visible:
      id: "onboarding-presentation-continue"
    timeout: 120000
- runFlow: subflows/complete-onboarding.yaml
- runFlow: subflows/seed-hero.yaml

# --- The Forge --------------------------------------------------------------
- tapOn:
    id: "tab-quests"
    optional: true
- tapOn:
    id: "forge-open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "forge-screen"
    timeout: 15000
    optional: true
- takeScreenshot: 60-forge
- scroll
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 61-forge-scrolled
- scrollUntilVisible:
    element:
      id: "forge-bosses-new"
    direction: DOWN
    optional: true
- tapOn:
    id: "forge-bosses-new"
    optional: true
- extendedWaitUntil:
    visible:
      id: "boss-editor"
    timeout: 10000
    optional: true
- takeScreenshot: 62-boss-editor
- runFlow: subflows/back-to-tabs.yaml

- tapOn:
    id: "tab-quests"
    optional: true
- tapOn:
    id: "forge-open"
    optional: true
- scrollUntilVisible:
    element:
      id: "forge-exercises-new"
    direction: DOWN
    optional: true
- tapOn:
    id: "forge-exercises-new"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 63-exercise-new
- scroll
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 64-exercise-new-scrolled
- runFlow: subflows/back-to-tabs.yaml

- tapOn:
    id: "tab-quests"
    optional: true
- tapOn:
    id: "forge-open"
    optional: true
- tapOn:
    id: "forge-adventures-new"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 65-adventure-editor
- runFlow: subflows/back-to-tabs.yaml

# --- Journal sub-pages ------------------------------------------------------
- tapOn:
    id: "tab-journal"
    optional: true
- tapOn:
    id: "journal-tab-stats"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- scrollUntilVisible:
    element:
      id: "journal-chip-lifetime"
    direction: DOWN
    optional: true
- tapOn:
    id: "journal-chip-lifetime"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 66-journal-lifetime
- back
- scrollUntilVisible:
    element:
      id: "journal-chip-achievements"
    direction: DOWN
    optional: true
- tapOn:
    id: "journal-chip-achievements"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 67-journal-achievements
- back
# Not here: the bosses chip (only once a boss has fallen, the seeded hero has none) and the
# chronicle door (only inside the year-end window, `chronicleWindow`). Both are noted in the ledger.
# Re-enter the tab rather than `back`: a back from a tap that opened nothing leaves the Journal.
- tapOn:
    id: "tab-journal"
    optional: true
- tapOn:
    id: "journal-tab-stats"
    optional: true
- scrollUntilVisible:
    element:
      id: "journal-work-link"
    direction: DOWN
    optional: true
- tapOn:
    id: "journal-work-link"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 69-journal-balance
# Balance keeps the tab bar, so back-to-tabs would stop here and leave it on the Journal's stack.
- back
- runFlow: subflows/back-to-tabs.yaml

