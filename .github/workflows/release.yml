# Build a signed APK and AAB on a version tag, and publish them.
#
# `npm run release` bumps the version, tags it and pushes; this picks the tag up, runs every
# gate, builds, attaches the APK to a GitHub Release that the F-Droid job downstream also
# serves, and uploads the AAB to Play's internal testing track behind a manual approval gate
# (the `play-internal` environment — see the `play` job below).
#
# Signing: SIGNING_KEYSTORE_BASE64 + SIGNING_* secrets, when they exist. Without them the build
# falls back to Expo's debug keystore, which is fine for passing an APK to friends but produces
# an app that can never be updated in place by a properly signed one — and F-Droid and Play both
# need a stable key. See docs/fdroid.md.
#
# Plain Gradle throughout, no EAS/Expo build service — see docs/planning/roadmap.md §1 for why.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing at the workflow level, so a job states what it needs: the signing key and the Play
# credentials are in this workflow, and a write token should only sit beside the step that
# publishes.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    # write: action-gh-release creates the GitHub Release and attaches the APK.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every tag, not the one commit: the migration check below asks which tag came before.
          fetch-depth: 0

      # At most one new migration per release, so the one that breaks is never a guess. A
      # deliberate exception is a `-- multi-migration-ok: <reason>` line in the file itself. Only
      # on a tag: a workflow_dispatch build on a branch publishes nothing and has no "this release".
      - name: At most one new migration since the previous tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/check-release-migrations.sh "$TAG"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          # zizmor: ignore[cache-poisoning] the npm cache holds tarballs, and `npm ci` checks each
          # one against the integrity hash in package-lock.json before installing it.
          cache: npm
      - run: npm ci

      # The same gates CI runs. A release should never be the first time they are checked, and it
      # must never be possible to ship past a red one.
      - run: npx biome ci --error-on-warnings --reporter=github .
      - run: npx tsc --noEmit --project tsconfig.json
      # Pillow decodes the boss art for __tests__/boss-art-frames.test.ts, which fails in CI without it.
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends python3-pil
      - run: npm test -- --coverage
      - run: npm run deadcode

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      # `packages` without its default `tools`, which cmdline-tools 20.0 no longer has (see
      # pages.yml).
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      # Without this the runner compiles React Native, every Expo module and the NDK output from
      # nothing, every single run — which is most of the 29 minutes a release used to take. What
      # is cached is the Gradle user home, not a directory under the workspace, which is why no
      # input points this at android/: `build-root-directory` was dropped by the action and had
      # been warning "Unexpected input" on every release since at least v1.9.0 while the cache
      # worked anyway.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # zizmor: ignore[cache-poisoning] no other workflow uses setup-gradle, so the only runs
          # that ever write this cache are this one's, a tag or a dispatch, both needing push.
          # Dropping it would put a release back near the 29 minutes it used to take.
          cache-read-only: false

      # The same drift check ci.yml runs, and it belongs here too: scripts/release.sh regenerates
      # android/ before tagging, but a tag pushed by hand bypasses that script entirely and
      # nothing downstream re-checked it. It runs with the full node_modules, because that is
      # what release.sh prebuilds with — dev-client's config plugin adds an `exp+bati` scheme to
      # the manifest, so a prebuild after the drop below differs by exactly that line and the
      # check would fail on every release (v1.9.0 did). Runs before the keystore step, which
      # writes into android/ itself.
      - name: The committed android/ matches app.json and plugins
        run: |
          npx expo prebuild --clean --platform android
          git add -A android
          git diff --cached --exit-code --stat -- android
          git reset

      # expo-dev-client is a devDependency, but `npm ci` installs devDependencies and autolinking
      # then compiles it into the release APK — 26 dev-launcher classes, a `exp+bati` deep-link
      # scheme and a SYSTEM_ALERT_WINDOW request, all shipped to users. `npm ci --omit=dev` is not
      # the fix: babel-preset-expo lives there too and Metro needs it to bundle.
      #
      # The F-Droid recipe deletes exactly these four, so doing it here keeps both builds compiling
      # the same tree — which is what makes a reproducible build possible at all.
      - name: Drop the dev-client tooling from the release build
        run: |
          rm -rf node_modules/expo-dev-client node_modules/expo-dev-launcher \
                 node_modules/expo-dev-menu node_modules/expo-dev-menu-interface

      # Regenerated a second time, now without dev-client, so the manifest and the autolinked
      # classes both come from the same tree F-Droid builds.
      - name: Generate the native project
        run: npx expo prebuild --clean --platform android

      # No `if:` on the secret. The secrets context is not available in step conditions — using
      # it there makes the whole workflow file invalid, which shows up as a run with no jobs and
      # no error, exactly as it did on v1.0.1. The check moves into the shell instead.
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            # On a tag this is fatal. `::warning::` does not fail a job, so the old `exit 0` here
            # meant a missing or mis-rotated secret produced a green run that *published* a
            # debug-signed APK — an app that can never be updated in place by a properly signed
            # one. A release that cannot be signed is not a degraded release, it is a poisoned one.
            if [ "$IS_TAG" = "true" ]; then
              echo "::error::No signing key configured, refusing to publish an unsignable release."
              exit 1
            fi
            echo "::warning::No signing key — debug signature. Fine here: workflow_dispatch does not publish."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          # The leading newline is not cosmetic. Expo generates gradle.properties without a
          # trailing one, so a bare `>>` glues the first property onto the end of the last
          # existing line — `expo.inlineModules.watchedDirectories=[]MYAPP_UPLOAD_STORE_FILE=...`
          # — and the autolinking step then dies on a value it cannot parse, reporting only
          # "Process 'command 'node'' finished with non-zero exit value 1".
          printf '\n' >> android/gradle.properties
          # keytool's default store type is PKCS12, where the key password *is* the store
          # password — so SIGNING_KEY_PASSWORD is optional and falls back rather than failing the
          # build on a secret that had no reason to exist.
          {
            echo "MYAPP_UPLOAD_STORE_FILE=release.keystore"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } >> android/gradle.properties

      # arm64 only. The generated default builds four architectures: the two x86 ones exist for
      # emulators (no phone ships them) and armeabi-v7a covers 32-bit phones from ~2015 — dropping
      # it saves 17 MB of duplicated native libs. R8 minify + resource shrinking cut the dex from
      # ~18 MB to a fraction. All passed here rather than written into gradle.properties so a
      # local `expo run:android` keeps building fat and fast, and android/ stays drift-free;
      # only the published artefact narrows. fdroid/fdroiddata-recipe.yml runs the same command —
      # keep the two in sync.
      # bundleRelease alongside assembleRelease: GitHub Releases and F-Droid want the APK,
      # Play refuses anything else and only takes the AAB. Same signing config, same flags,
      # one Gradle invocation — the two artefacts are guaranteed to match the same commit.
      - name: Build
        run: >-
          ./gradlew assembleRelease bundleRelease --no-daemon
          -PreactNativeArchitectures=arm64-v8a
          -Pandroid.enableMinifyInReleaseBuilds=true
          -Pandroid.enableShrinkResourcesInReleaseBuilds=true
        working-directory: android

      - name: Name the artefacts after the tag
        id: artefacts
        run: |
          # GITHUB_REF_NAME is the tag on a tag push and the *branch* on workflow_dispatch. A
          # branch name may contain a slash, which turned the copy below into a path into a
          # directory that does not exist — so a dispatch smoke-test failed after a perfectly good
          # build. Only a real tag names the artefact; anything else is "dev".
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev"
          fi
          apk_src=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          apk_dest="bati-${version}.apk"
          cp "$apk_src" "$apk_dest"
          echo "apk_path=$apk_dest" >> "$GITHUB_OUTPUT"

          aab_src=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          aab_dest="bati-${version}.aab"
          cp "$aab_src" "$aab_dest"
          echo "aab_path=$aab_dest" >> "$GITHUB_OUTPUT"

      # A size budget is the only thing that keeps the APK from drifting back up — a one-off
      # optimisation pass does not. It is a ratchet: lower MAX_MB after any release that measures
      # under it, never raise it to make a build pass.
      #
      # Baseline: v1.13.0 shipped at 67.1 MiB. Four measured cuts since — 4.7 MiB of unused font
      # weights, 1.2 MiB of unused Lucide icons, 15.6 MiB from compressing the native libraries,
      # 0.6 MiB of GIF decoders — put the next build near 45 MiB, so 64 leaves deliberate slack
      # for an estimate that proves optimistic. Lower it to just above whatever that build
      # actually reports. `workflow_dispatch` on a branch builds the APK without publishing, so a
      # change can be weighed before it is tagged.
      - name: Size budget
        env:
          APK_PATH: ${{ steps.artefacts.outputs.apk_path }}
          MAX_MB: 55
        run: |
          mb=$(( $(stat -c%s "$APK_PATH") / 1048576 ))
          echo "APK: ${mb} MiB (budget ${MAX_MB} MiB)" >> "$GITHUB_STEP_SUMMARY"
          if (( mb > MAX_MB )); then
            echo "::error::APK is ${mb} MiB, over the ${MAX_MB} MiB budget"
            exit 1
          fi

      # The permission list is the app's public record: the install screen, what Exodus Privacy
      # publishes, what an F-Droid reviewer reads back to you. __tests__/android-permissions.test.ts
      # guards it on every push, but it scans npm package manifests and a Gradle AAR is invisible
      # to it — WAKE_LOCK and FOREGROUND_SERVICE shipped in every APK for months without appearing
      # in any list. This step reads the built artefact instead, so nothing arrives unannounced.
      # It runs on workflow_dispatch too, which is how a change gets weighed before it is tagged.
      - name: Permission list
        env:
          APK_PATH: ${{ steps.artefacts.outputs.apk_path }}
        run: |
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          "$aapt2" dump permissions "$APK_PATH" \
            | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" | sort -u > got.txt
          # A parse that quietly returns nothing would match an empty list and pass forever, which
          # is the failure this whole step exists to stop happening again.
          grep -qx "android.permission.VIBRATE" got.txt || {
            echo "::error::could not read any permission out of $APK_PATH — the aapt2 output format changed"
            exit 1
          }
          grep -v -e '^#' -e '^$' fdroid/expected-permissions.txt | sort -u > want.txt
          if ! diff -u want.txt got.txt; then
            echo "::error::the APK's permissions differ from fdroid/expected-permissions.txt — justify each new one in __tests__/android-permissions.test.ts and add it there, or remove whatever pulled it in"
            exit 1
          fi
          echo "Permissions: $(wc -l < got.txt), all declared" >> "$GITHUB_STEP_SUMMARY"

      # Play refuses updates whose native code cannot run on 16 KB memory pages from 2027-02-01.
      # Every .so in v2.6.0 already complies; a single native dependency built with the old 4 KB
      # linker default would break that silently, and the first report would be a rejected upload.
      # The ELF segments are the whole check: `expo.useLegacyPackaging=true` stores the libraries
      # compressed, so the zip-alignment half of the rule (`zipalign -c -P 16`) has nothing to see.
      # The AAB is what Play receives; the APK is what F-Droid users run.
      - name: 16 KB page size
        env:
          APK_PATH: ${{ steps.artefacts.outputs.apk_path }}
          AAB_PATH: ${{ steps.artefacts.outputs.aab_path }}
        run: |
          mkdir -p so
          unzip -q "$APK_PATH" 'lib/*' -d so/apk
          unzip -q "$AAB_PATH" 'base/lib/*' -d so/aab
          count=0
          for f in so/apk/lib/*/*.so so/aab/base/lib/*/*.so; do
            # Outside a command substitution, so a readelf failure fails the step under `bash -e`.
            aligns=$(readelf -lW "$f" | awk '/LOAD/ { print $NF }')
            [[ -n "$aligns" ]] || { echo "::error::no LOAD segment read from $f"; exit 1; }
            for align in $aligns; do
              if (( align < 0x4000 )); then
                echo "::error::$f has a LOAD segment aligned to $align, below 16 KB"
                exit 1
              fi
            done
            count=$((count + 1))
          done
          echo "16 KB pages: $count libraries aligned (APK + AAB)" >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # zizmor: ignore[superfluous-actions] `gh release create` would do it, but this step only
          # runs on a tag, so a rewrite would first be tested on a real release. Pinned by SHA.
          files: ${{ steps.artefacts.outputs.apk_path }}
          generate_release_notes: true
          body: |
            Install directly, or add the F-Droid repository for automatic updates:
            `https://guiforge.github.io/bati/fdroid/repo`

            This APK is not from an app store. Android will ask you to allow installs from an
            unknown source the first time.

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk
          path: ${{ steps.artefacts.outputs.apk_path }}

      # Only the play job needs this one, and only on a tagged build — no point keeping it
      # around otherwise.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: aab
          path: ${{ steps.artefacts.outputs.aab_path }}

  # Gated behind the `play-internal` environment: set it up once in Settings → Environments
  # with yourself as a required reviewer, so a bad tag can't reach real testers unattended.
  # Needs PLAY_SERVICE_ACCOUNT_JSON on that environment — a Play Console service account with
  # "release to testing tracks" permission. See docs/planning/roadmap.md §1.
  play:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: play-internal
    permissions:
      contents: read
    steps:
      # Only for the store listing (fastlane/metadata/android below) — the AAB itself comes
      # from the apk job's artifact, not this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aab

      # fastlane supply, not a wrapper action: fastlane/metadata/android *is* supply's native
      # layout (that is why the repo keeps it in that shape — F-Droid reads the same files), so
      # the whole listing — descriptions, changelogs, icon, featureGraphic, screenshots — rides
      # along with the binary. SUPPLY_JSON_KEY_DATA is supply's own env var for the key, which
      # keeps the JSON out of argv and off the filesystem.
      - name: Upload the AAB and store listing to Play
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # sudo: the runner's system Ruby owns /var/lib/gems.
          sudo gem install fastlane --no-document
          fastlane supply \
            --package_name com.guiforge.bati \
            --track internal \
            --aab bati-*.aab \
            --metadata_path fastlane/metadata/android
