# Maestro E2E Test - Interrupting a session
#
# The data-loss path. A session that cannot be paused, resumed or abandoned cleanly is
# how a hero loses their work. The crash-and-recover half is unit-tested
# (__tests__/useSessionRecovery.test.ts) because killing the process mid-flow is not
# something Maestro can do reliably; this covers the three deliberate interruptions.
#
# testID only, so an emulator in fr_FR passes too.
#
# Taps on the session screen cap `waitToSettleTimeoutMs`: its timer ticks every second, so an
# uncapped tap waits Maestro's full ceiling (see subflows/run-a-session.yaml).

appId: com.guiforge.bati.dev
---
- launchApp:
    clearState: true

- runFlow: subflows/complete-onboarding.yaml

# Through the Quests tab, not the Home button: `home-start-session` runs useSmartAction, whose
# destination depends on the active oath and the suggestion state. A flow that has to end up on
# a specific quest cannot start from a button that decides where to go.
- tapOn:
    id: "tab-quests"

- assertVisible:
    id: "quests-quest-card"
- tapOn:
    id: "quests-quest-card"
    index: 0

- assertVisible:
    id: "quest-start"
- tapOn:
    id: "quest-start"

# Warm-up is on by default; skip straight to the workout being interrupted. Waited for, not
# fired blind — see the note in subflows/complete-a-session.yaml.
- extendedWaitUntil:
    visible:
      id: "session-skip-warmup"
    timeout: 15000
    optional: true
- tapOn:
    id: "session-skip-warmup"
    optional: true
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false

# The start screen waits ten seconds, or for GO. Tapped either way, see complete-a-session.yaml.
- extendedWaitUntil:
    visible:
      id: "session-start-go"
    timeout: 15000
    optional: true
- tapOn:
    id: "session-start-go"
    optional: true
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false

# The start screen hands over to the first exercise.
- extendedWaitUntil:
    visible:
      id: "session-complete-exercise"
    timeout: 15000

# --- Pause and resume -------------------------------------------------------

- tapOn:
    id: "session-pause"
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: "session-resume"

# The paused view is not asserted by the *absence* of the exercise controls: the overlay
# covers them but leaves them mounted, and Maestro reads the view tree, not occlusion.

- tapOn:
    id: "session-resume"
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false

# Back to the exercise, overlay gone.
- assertVisible:
    id: "session-complete-exercise"
- assertNotVisible:
    id: "session-resume"

# --- Restart the round ------------------------------------------------------

- tapOn:
    id: "session-pause"
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: "session-restart-round"
- tapOn:
    id: "session-restart-round"
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false

# Restarting erases the round's sets, so it asks first (PausedOverlay handleRestartRound). The
# confirmation is a native Alert: its buttons take no testID, but the destructive one is always
# Android's positive button, whatever the language.
- tapOn:
    id: "android:id/button1"
- assertVisible:
    id: "session-complete-exercise"

# --- Abandon ----------------------------------------------------------------

- tapOn:
    id: "session-pause"
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: "session-quit"
- tapOn:
    id: "session-quit"
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false

# Abandoning asks too (PausedOverlay handleQuit), through the same kind of native Alert.
- tapOn:
    id: "android:id/button1"

# Where quitting lands is not asserted, because it has not held still. This flow asserted the
# quest (`handleQuit` calls `router.back()`), then Home after two failure screenshots showed the
# Home tab, and on 2026-09-13, with the confirmation tapped, it landed on the quest again. What
# matters here is that the app is somewhere navigable rather than stuck in a torn-down session,
# so the flow leaves through the tab bar, from wherever it is.
- tapOn:
    id: "tab-home"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "home-start-session"
    timeout: 10000
