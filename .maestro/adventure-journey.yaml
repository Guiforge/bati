# Maestro E2E Test - Adventure (campaign) journey
#
# The second way into a workout: browse campaigns -> open one -> start its next step ->
# run that step's session to victory. Distinct from main-journey.yaml, which reaches a
# session through the quest gallery; this one goes through the campaign runner.
#
# Then asserts the campaign moved: step 1 completed, step 2 current. Through testIDs that carry
# each step's status, so no translated copy is pinned. The flow used to stop at "a session
# opened", and passed while a session started from the step row advanced nothing: the hero
# finished "Couper du bois" again and again with step 2 still locked.
#
# testID only, so an emulator in fr_FR passes too.
#
# Taps on tabs cap `waitToSettleTimeoutMs`: the village's embers and the Home flame never stop
# moving, and an uncapped tap waits Maestro's full ceiling (see subflows/run-a-session.yaml).

appId: com.guiforge.bati.dev
---
- launchApp:
    clearState: true

- runFlow: subflows/complete-onboarding.yaml

# --- Browse campaigns -------------------------------------------------------

- tapOn:
    id: "tab-adventures"
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: "adventures-screen"
- assertVisible:
    id: "adventures-adventure-card"

- tapOn:
    id: "adventures-adventure-card"
    index: 0

# --- Start the next step ----------------------------------------------------

# The step row, not the CTA: it is the door that lost the run step, and it now goes through the
# CTA's own handler, so this walks both. On a cleared state step 1 is current, with no run yet.
- assertVisible:
    id: "adventure-start"
- tapOn:
    id: "adventure-step-0-active"

# Starting a run hands off to the step's quest details screen.
- runFlow: subflows/complete-a-session.yaml

# --- Still navigable afterwards ---------------------------------------------

- tapOn:
    id: "tab-adventures"
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: "adventures-adventure-card"

# --- The campaign moved -----------------------------------------------------

# The campaign under way sorts first (`adventureOrder`).
- tapOn:
    id: "adventures-adventure-card"
    index: 0
- extendedWaitUntil:
    visible:
      id: "adventure-step-0-completed"
    timeout: 10000
- assertVisible:
    id: "adventure-step-1-active"
