plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.guiforge.bati'
version = '0.1.0'

android {
  namespace "expo.modules.batiscanner"
  defaultConfig {
    // Read by expo-module-gradle-plugin as the maven artifact version, see bati-location.
    versionName '0.1.0'
  }
}

// A QR scanner with no Google code: docs/designs/multiplayer/qr-scanner.md says why these and not
// expo-camera (ML Kit) or ZXing's Java port (its classes live in com.google.zxing).
dependencies {
  implementation 'io.github.zxing-cpp:android:3.1.1'
  implementation 'androidx.camera:camera-camera2:1.6.2'
  implementation 'androidx.camera:camera-lifecycle:1.6.2'
  implementation 'androidx.camera:camera-view:1.6.2'
}
