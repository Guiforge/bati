# The build recipe for the *official* F-Droid catalogue at f-droid.org.
#
# This file is not read by anything here. It is the source of truth for a file that lives
# somewhere else: submitting means forking https://gitlab.com/fdroid/fdroiddata, copying this to
# `metadata/com.guiforge.bati.yml`, committing it as "New App: com.guiforge.bati" and opening a
# merge request. Keeping our copy in the repo means the recipe is reviewed and versioned with the
# code it builds, instead of drifting inside a fork nobody looks at.
#
# COMMENT CONVENTION — every comment sits at column 0, because the sync step strips exactly those:
#
#   grep -v '^#' fdroid/fdroiddata-recipe.yml | sed '/^$/d' > metadata/com.guiforge.bati.yml
#   fdroid rewritemeta com.guiforge.bati   # then canonicalise: field order, spacing, sorted lists
#
# fdroiddata's own templates open with "PLEASE REMOVE ALL COMMENTS BEFORE SUBMITTING", so the
# submitted file must carry none. What a reviewer does need travels in `MaintainerNotes` below,
# which is YAML content and survives the sync. Blank lines inside that block would not (the sed),
# so it stays a single block. An indented comment here would leak into the submission — don't.
#
# Not to be confused with `fdroid/config.yml`, which configures our own self-hosted repository:
# that one signs and indexes APKs we build, this one asks F-Droid to build from source on its own
# infrastructure.
#
# WHY THE UNUSUAL FLAGS — the long form, for future editors; the short form is in MaintainerNotes.
#
# * No `subdir`, no `gradle:`. fdroidserver validates `subdir` immediately after checkout
#   (common.py, "Missing subdir"), *before* `init` runs. `android/` is gitignored and generated by
#   `expo prebuild`, so it does not exist at checkout and any `subdir` into it aborts the build
#   before a single command runs. Driving Gradle from `build:` sidesteps the ordering.
# * Node is pinned in `sudo:` (their build image ships one too old for Expo SDK 57) so a rebuild
#   years from now resolves the same toolchain. `sudo:` is skipped when `fdroid build` runs
#   without a dedicated build server, which is why a local test needs Node preinstalled.
# * `npm ci`, not `npm ci --omit=dev`: babel-preset-expo lives in devDependencies and Metro needs
#   it to bundle. The expo-dev-* family is deleted by hand instead — dev tooling with no business
#   in a release, and the scanner strips enough of its innards that autolinking then fails on a
#   half-present module.
# * Expo SDK 57 ships 22 native modules as prebuilt .aar files in bundled local-maven-repo dirs,
#   Kotlin sources unused beside them. `package.json` sets
#   `expo.autolinking.buildFromSource: [".*"]` so Gradle compiles every module from source
#   (~20 subprojects become 42); `init:` deletes every local-maven-repo explicitly rather than
#   leaving prebuilt binaries in the tree for the scanner to worry about. This mirrors
#   fdroiddata's templates/build-react-native.yml, which recommends exactly this switch.
# * ARM only: the generated default builds four ABIs and the two x86 ones exist for emulators —
#   162 MB against 112 MB, measured.
# * `scanignore`, emphatically not `scandelete`: with scandelete the scanner *deleted the
#   offending file*, and what offended it was a legitimate `maven { url "$rootDir/../…" }` line
#   inside react-native-safe-area-context and masked-view — taking their whole build.gradle with
#   it. The build then died on "No variants exist", a remarkably indirect way of saying a build
#   file went missing. Ignoring is safe: the prebuilt binaries are already deleted in `init:` and
#   no proprietary dependency is left to find.
# * No Firebase step: `expo-notifications` was removed from the app in 1.0.3, and it was the only
#   thing pulling firebase-messaging (the 200-line patch script that used to strip it went too).
#
# REPRODUCIBLE BUILDS: attempted, measured, deliberately not enabled. Comparing our released APK
# against a local `fdroid build` went from 26 differing files to 11 (the dev client had been
# shipping in releases — that fix mattered regardless — and the GNU build-id is stripped from
# native libraries). What remains is resources.arsc, 51% different through AAPT2 string-pool
# ordering, plus a handful of codegen libraries. Pinning AllowedAPKSigningKeys against a build
# with a known diff would make verification fail and nothing publish, with a weeks-long round
# trip per attempt. So F-Droid signs with its own key, permanently — the catalogue listing is a
# fresh install, and the self-hosted repository keeps updating everyone who already has the app.
#
# ANTIFEATURES: none apply. No ads, no tracking, no network calls at all; the artwork is
# CC BY-SA 4.0 with scripts/provenance.json recording model, prompt and seed for every image, so
# NonFreeAssets does not apply either.
#
# STATUS: recipe proven by real runs — `fdroid build` produced APKs for 10002, 10003 and 10201
# (90 MB, 11 permissions, zero Firebase entries), and the 10003 build ran on a device through
# onboarding and a full session. Re-run `fdroid build com.guiforge.bati:<code>` after any version
# bump before touching the merge request: that rule caught every one of the five blockers.
#
# Categories: both are in fdroiddata's config/categories.yml and both are literally true — being
# listed under each is the difference between someone finding this and not.

Categories:
  - Sports & Health
  - Role-Playing Game
License: MIT
AuthorName: Guillaume Pouyat
SourceCode: https://github.com/Guiforge/bati
IssueTracker: https://github.com/Guiforge/bati/issues
Changelog: https://github.com/Guiforge/bati/releases

RepoType: git
Repo: https://github.com/Guiforge/bati.git

Builds:
  - versionName: 1.2.1
    versionCode: 10201
    commit: v1.2.1
    sudo:
      - apt-get update || true
      - apt-get install -y --no-install-recommends curl ca-certificates python3
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y --no-install-recommends nodejs
    init:
      - npm ci
      - rm -rf node_modules/expo-dev-client node_modules/expo-dev-launcher
          node_modules/expo-dev-menu node_modules/expo-dev-menu-interface
      - find node_modules -type d -name local-maven-repo -prune -exec rm -rf {} +
    build:
      - npx expo prebuild --clean --platform android --no-install
      - cd android && ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
    output: android/app/build/outputs/apk/release/app-release.apk
    scanignore:
      - node_modules

MaintainerNotes: |-
    Expo / React Native app; android/ is generated by `expo prebuild` and is not in the
    checkout, which is why the build is driven from build: rather than subdir/gradle flags
    (fdroidserver validates subdir before init runs).
    package.json sets expo.autolinking.buildFromSource [".*"], so every Expo module compiles
    from source; init: deletes their bundled prebuilt local-maven-repo AARs, plus the
    expo-dev-* packages (devDependencies, but npm ci installs them and autolinking would
    compile dev tooling into the release).
    scanignore rather than scandelete: scandelete removes the build.gradle of
    react-native-safe-area-context and @react-native-masked-view over a legitimate local
    maven { url } line, and the build then fails with "No variants exist".
    No Firebase and no network code anywhere in the app.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 1.2.1
