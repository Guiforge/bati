# The build recipe for the *official* F-Droid catalogue at f-droid.org.
#
# This file is not read by anything here. It is the source of truth for a file that lives
# somewhere else: submitting means forking https://gitlab.com/fdroid/fdroiddata, copying this to
# `metadata/com.guiforge.bati.yml`, committing it as "New App: com.guiforge.bati" and opening a
# merge request. Keeping our copy in the repo means the recipe is reviewed and versioned with the
# code it builds, instead of drifting inside a fork nobody looks at.
#
# Not to be confused with `fdroid/config.yml`, which configures our own self-hosted repository.
# The two are unrelated: that one signs and indexes APKs we build, this one asks F-Droid to build
# them itself, from source, on its own infrastructure.
#
# NO PREBUILT BINARIES: Expo SDK 57 ships its native modules as precompiled .aar files in a
# bundled `local-maven-repo` — 22 of them, with the Kotlin sources unused beside them. `package.json`
# sets `expo.autolinking.buildFromSource: [".*"]`, which makes Gradle compile every Expo module
# from those sources instead; the subproject count goes from ~20 to 42 and the AARs stop being
# consumed. Nothing here needs to enable it, but a reviewer checking for prebuilt binaries should
# know why they are present in the tree and unused. Removing them outright is not possible — npm
# puts them there — so `init` below deletes every local-maven-repo explicitly.
#
# STATUS: not yet submitted, but this recipe has been run for real. `fdroid build` produced an APK
# locally against both 10002 and 10003 — 112 MB, 11 permissions, zero Firebase entries — and the
# 10003 build was installed on a device and driven through onboarding and a session. Five separate
# blockers had to be fixed to get there, and each is written down beside the setting that fixes it.
#
# Only the version numbers moved for 10200: nothing in `dependencies` changed between 1.0.3 and
# 1.2.0, so the recipe is unchanged otherwise. Re-run `fdroid build com.guiforge.bati:10200` before
# opening the merge request anyway — that has been the rule that caught every one of the five.

# Both are in fdroiddata's config/categories.yml, and both are literally true — being listed under
# each is the difference between someone finding this and not. Discoverability is the whole reason
# for submitting here rather than staying on the self-hosted repository.
Categories:
  - Sports & Health
  - Role-Playing Game
License: MIT
AuthorName: Guillaume Pouyat
SourceCode: https://github.com/Guiforge/bati
IssueTracker: https://github.com/Guiforge/bati/issues
Changelog: https://github.com/Guiforge/bati/releases

RepoType: git
Repo: https://github.com/Guiforge/bati.git

Builds:
  - versionName: 1.2.1
    versionCode: 10201
    commit: v1.2.1
    # No `subdir`, and no `gradle:`. Both are tempting and both are wrong here: fdroidserver
    # validates `subdir` immediately after checkout (common.py, "Missing subdir"), *before* it runs
    # `init`. `android/` is gitignored and generated by `expo prebuild`, so at checkout time it does
    # not exist and any `subdir` pointing into it aborts the build before a single command runs.
    # Driving Gradle from `build:` sidesteps the ordering entirely.

    # Expo SDK 57 needs a newer Node than the build image ships. Pinned rather than "latest" so a
    # rebuild of this version years from now still resolves the same toolchain. Skipped silently
    # when `fdroid build` runs off a dedicated build server, which is why a local test needs Node
    # already installed.
    sudo:
      - apt-get update || true
      - apt-get install -y --no-install-recommends curl ca-certificates python3
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y --no-install-recommends nodejs

    # `npm ci` rather than `npm ci --omit=dev`: babel-preset-expo and the Babel plugins live in
    # devDependencies and Metro needs them to bundle the JavaScript, so omitting dev breaks the
    # build outright. The dev-client family is deleted by hand instead — it is developer tooling
    # that has no business in a release, and the scanner strips enough of its innards that
    # autolinking then fails on a half-present module.
    #
    # There is no Firebase step here any more. `expo-notifications` was removed in 1.0.3, and it
    # was the only thing pulling firebase-messaging in — the patch script that used to strip it
    # went with it.
    init:
      - npm ci
      - rm -rf node_modules/expo-dev-client node_modules/expo-dev-launcher
          node_modules/expo-dev-menu node_modules/expo-dev-menu-interface
      # Delete the prebuilt AARs and JARs ourselves rather than leaving it to the scanner. There
      # are 22 of them, in every Expo module's local-maven-repo, and `buildFromSource` means
      # nothing consumes them — but they must not be in the tree, and doing it here is explicit
      # rather than a side effect of a scan flag.
      - find node_modules -type d -name local-maven-repo -prune -exec rm -rf {} +

    # ARM only. The generated default builds four architectures and the two x86 ones exist for
    # emulators, so a third of the download was for nobody: 162 MB against 112 MB, measured.
    build:
      - npx expo prebuild --clean --platform android --no-install
      - cd android && ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

    output: android/app/build/outputs/apk/release/app-release.apk

    # `scanignore`, emphatically not `scandelete`. With scandelete the scanner *deletes the
    # offending file*, and what offends it here is a `maven { url "$rootDir/../node_modules/…" }`
    # line inside react-native-safe-area-context and masked-view — legitimate, and the file it
    # deleted was their whole build.gradle. The build then died on "No variants exist", which is
    # a remarkably indirect way of saying a build file went missing.
    #
    # Ignoring is safe because what scanning protects against is handled above: the prebuilt
    # binaries are deleted explicitly in `init`, and there is no proprietary dependency left to
    # find — expo-notifications, the only thing that pulled one in, is gone.
    scanignore:
      - node_modules

# Reproducible builds: attempted, measured, and deliberately not enabled. Comparing our released
# APK against a local `fdroid build` went from 26 differing files to 11 (the dev client had been
# shipping in releases — that fix mattered regardless — and the GNU build-id is stripped from
# native libraries). What remains is resources.arsc, 51% different through AAPT2 string-pool
# ordering, plus a handful of codegen libraries. Pinning AllowedAPKSigningKeys against a build
# with a known diff would make F-Droid's verification fail and nothing publish, with a weeks-long
# round trip per attempt. So F-Droid signs with its own key, permanently — the catalogue listing
# is a fresh install, and the self-hosted repository keeps updating everyone who already has the
# app.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 1.2.1
CurrentVersionCode: 10201

# Deliberately absent, and worth understanding before adding either:
#
# AntiFeatures: none apply. No ads, no tracking, no network calls at all, and the artwork is
#   CC BY-SA 4.0 with scripts/provenance.json recording model, prompt and seed for every image, so
#   NonFreeAssets does not apply either.
#
# AntiFeatures and the signing key are handled above and below respectively.
