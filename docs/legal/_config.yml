# The public site, built from this folder only (see .github/workflows/pages.yml).
#
# No theme on purpose: `_layouts/default.html` is the whole shell. Without this file the
# build action injects a config of its own and the pages come back wearing jekyll-theme-primer.
#
# Paths are root-absolute (/assets/…) because the site is served at the root of getbati.app,
# the custom domain set in the repository's Pages settings. Take that domain away and the site
# falls back to guiforge.github.io/bati/, where every one of those paths 404s.
title: Bati
description: >-
  A dark-fantasy fitness RPG for Android. Workouts become quests, reps become damage, and the
  village you build is made of what you actually lifted. Offline first, no account, no tracking.
url: https://getbati.app
