# Reusable: from the moment a session opens, through it to the victory screen, then dismiss it.
#
# The walk itself is `play-to-victory.yaml` (split out so a flow can stop on the victory screen);
# this adds the Continue tap. Same behaviour as before the split.
appId: com.guiforge.bati.dev
---
- runFlow: play-to-victory.yaml
- tapOn:
    id: "session-victory-continue"
