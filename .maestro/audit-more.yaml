# --- The two confirmations that cost a hero something -----------------------
# Each is opened and cancelled: the dialog is the shot, the data stays.
# Twice: a second tap on the active tab pops its stack to the root.
- tapOn:
    id: "tab-journal"
    optional: true
- tapOn:
    id: "tab-journal"
    optional: true
- tapOn:
    id: "journal-tab-history"
    optional: true
- tapOn:
    id: "journal-session-card"
    index: 0
    optional: true
- scrollUntilVisible:
    element:
      id: "journal-forget-session"
    direction: DOWN
    optional: true
- tapOn:
    id: "journal-forget-session"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 81-confirm-forget-session
- tapOn:
    id: "confirm-dialog-cancel"
    optional: true
- runFlow: subflows/back-to-tabs.yaml

# Last: a session cannot be left without quitting it.
- tapOn:
    id: "tab-quests"
    optional: true
- tapOn:
    id: "quests-quest-card"
    index: 0
    optional: true
- tapOn:
    id: "quest-start"
    optional: true
- tapOn:
    id: "narrative-confirm"
    optional: true
- tapOn:
    id: "session-skip-warmup"
    optional: true
- tapOn:
    id: "session-start-go"
    optional: true
- extendedWaitUntil:
    visible:
      id: "session-pause"
    timeout: 20000
    optional: true
- extendedWaitUntil:
    visible:
      id: "session-complete-exercise"
    timeout: 20000
    optional: true
- tapOn:
    id: "session-pause"
    optional: true
- extendedWaitUntil:
    visible:
      id: "session-quit"
    timeout: 8000
    optional: true
- tapOn:
    id: "session-quit"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 82-confirm-quit-session
